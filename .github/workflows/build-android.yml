name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # 可按需触发，例如手动或 tag 推送
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ===== 关键修复：替换 Gradle 下载地址为国内镜像 =====
      - name: Use Gradle mirror (Tencent Cloud)
        run: |
          # 如果你的 gradle-wrapper.properties 不在 android/ 目录下，请调整路径
          sed -i 's#https://services.gradle.org/distributions#https://mirrors.cloud.tencent.com/gradle#g' android/gradle/wrapper/gradle-wrapper.properties

      # ===== 缓存 Gradle 发行包（避免重复下载） =====
      - name: Cache Gradle distribution
        uses: actions/cache@v3
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ===== 缓存 Gradle 和 Android 构建缓存 =====
      - name: Cache Gradle and build cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            android/build
            android/app/build
          key: ${{ runner.os }}-gradle-cache-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-cache-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
