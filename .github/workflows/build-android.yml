name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK 17（根据项目需要调整）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. 修复 gradle-wrapper.properties 中的下载镜像（使用完整路径）
      - name: Replace Gradle distribution URL with Tencent mirror
        run: |
          # 明确指定完整路径（注意：工作目录是仓库根目录）
          PROP_FILE="phoneshell/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROP_FILE" ]; then
            sed -i 's#https://services.gradle.org/distributions#https://mirrors.cloud.tencent.com/gradle#g' "$PROP_FILE"
            echo "✅ gradle-wrapper.properties updated."
          else
            echo "❌ File not found: $PROP_FILE"
            exit 1
          fi

      # （可选）调试：查看修改后的内容
      - name: Show updated properties (optional)
        run: cat phoneshell/android/gradle/wrapper/gradle-wrapper.properties

      # 4. 赋予 Gradle Wrapper 执行权限（若使用 ./gradlew）
      - name: Grant execute permission for gradlew
        run: chmod +x phoneshell/gradlew  # 假设 gradlew 在 phoneshell/ 下，根据实际调整

      # 5. 执行 Android 构建（例如 assembleDebug）
      - name: Build with Gradle
        run: |
          cd phoneshell
          ./gradlew assembleDebug --no-daemon

      # 6. （可选）上传构建产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: phoneshell/app/build/outputs/apk/debug/*.apk
