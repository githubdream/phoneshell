name: Build PhoneShell Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # 修复1：强制 Gradle Wrapper 使用官方 URL（8.14.0）
      - name: Force Gradle Wrapper to 8.14.0
        run: |
          # 官方地址（稳定可用）
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.0-bin.zip" \
            > phoneshell/android/gradle/wrapper/gradle-wrapper.properties
          # 如果你仍想尝试腾讯镜像，可取消下面注释并注释上面一行
          # echo "distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-8.14-bin.zip" \
          #   > phoneshell/android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Gradle wrapper fixed ==="
          cat phoneshell/android/gradle/wrapper/gradle-wrapper.properties

      # 修复2：升级 AGP 版本到 8.11.1（Flutter 3.47.2 最低要求）
      - name: Upgrade AGP to 8.11.1
        run: |
          cd phoneshell/android
          # 情况A：新版 settings.gradle 里用 plugins { id("com.android.application") version "x.y.z" }
          if grep -q 'com.android.application' settings.gradle 2>/dev/null; then
            sed -i -E 's/(id\(?"com\.android\.application"\)?\s*version\s*"?)[0-9]+\.[0-9]+\.[0-9]+("?)/\18.11.1\2/' settings.gradle
            echo ">>> Patched AGP version in settings.gradle"
          fi
          # 情况B：老版 build.gradle 里 classpath 'com.android.tools.build:gradle:x.y.z'
          if [ -f build.gradle ] && grep -q 'com.android.tools.build:gradle' build.gradle; then
            sed -i -E "s/com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+\.[0-9]+/com.android.tools.build:gradle:8.11.1/" build.gradle
            echo ">>> Patched AGP version in build.gradle"
          fi
          cd ../..
          echo "=== settings.gradle (if exists) ==="
          cat phoneshell/android/settings.gradle 2>/dev/null || echo "(no settings.gradle)"
          echo "=== build.gradle (if exists) ==="
          cat phoneshell/android/build.gradle 2>/dev/null || echo "(no build.gradle)"

      # 修复3：禁用 AGP 9+ 新 DSL，兼容旧版 build.gradle.kts
      - name: Disable new DSL for AGP 9+
        run: |
          if [ ! -f phoneshell/android/gradle.properties ]; then
            touch phoneshell/android/gradle.properties
          fi
          echo "" >> phoneshell/android/gradle.properties
          echo "android.useNewDsl=false" >> phoneshell/android/gradle.properties
          echo "=== gradle.properties updated ==="
          cat phoneshell/android/gradle.properties

      - name: Flutter pub get
        working-directory: phoneshell
        run: flutter pub get

      # 修复4：构建时跳过 Flutter 的依赖校验（绕过 Gradle 版本警告）
      - name: Build release APK
        working-directory: phoneshell
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 重命名 APK 以便识别版本
      - name: Rename APK
        run: |
          mv phoneshell/build/app/outputs/flutter-apk/app-release.apk \
             phoneshell/build/app/outputs/flutter-apk/phoneshell-android-${{ github.ref_name }}.apk

      # 上传到 Actions Artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoneshell-android-apk
          path: phoneshell/build/app/outputs/flutter-apk/phoneshell-android-${{ github.ref_name }}.apk
          retention-days: 7

      # 如果是 tag 触发，自动发布到 GitHub Release
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "PhoneShell Android ${{ github.ref_name }}"
          files: phoneshell/build/app/outputs/flutter-apk/phoneshell-android-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
