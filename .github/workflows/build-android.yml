name: Build PhoneShell Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 使用 Flutter 3.47.2（内置 Dart 3.13，满足 ^3.9.2 要求）
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # 修复1：强制升级 Gradle Wrapper 到 8.14.0（Flutter 3.47 最低要求）
      - name: Force Gradle Wrapper to 8.14.0
        run: |
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.0-bin.zip" \
            > phoneshell/android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Gradle wrapper updated ==="
          cat phoneshell/android/gradle/wrapper/gradle-wrapper.properties

      # 修复2：禁用 AGP 9+ 新 DSL，兼容旧版 build.gradle.kts 语法
      - name: Disable new DSL for AGP 9+
        run: |
          if [ ! -f phoneshell/android/gradle.properties ]; then
            touch phoneshell/android/gradle.properties
          fi
          echo "" >> phoneshell/android/gradle.properties
          echo "android.useNewDsl=false" >> phoneshell/android/gradle.properties
          echo "=== gradle.properties updated ==="
          cat phoneshell/android/gradle.properties

      - name: Flutter pub get
        working-directory: phoneshell
        run: flutter pub get

      # 修复3：若仍然遇到 Gradle 版本检查失败，可取消下面注释的行（备选方案）
      # 但通常前两步已足够，保留注释作为应急开关
      - name: Build release APK
        working-directory: phoneshell
        run: flutter build apk --release
        # 如果需要跳过 Gradle 版本校验，可以追加 --android-skip-build-dependency-validation
        # run: flutter build apk --release --android-skip-build-dependency-validation

      # 重命名 APK 以便识别版本
      - name: Rename APK
        run: |
          mv phoneshell/build/app/outputs/flutter-apk/app-release.apk \
             phoneshell/build/app/outputs/flutter-apk/phoneshell-android-${{ github.ref_name }}.apk

      # 上传到 Actions Artifacts（方便手动下载）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoneshell-android-apk
          path: phoneshell/build/app/outputs/flutter-apk/phoneshell-android-${{ github.ref_name }}.apk
          retention-days: 7

      # 如果是通过 tag 触发，自动发布到 GitHub Release
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "PhoneShell Android ${{ github.ref_name }}"
          files: phoneshell/build/app/outputs/flutter-apk/phoneshell-android-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
