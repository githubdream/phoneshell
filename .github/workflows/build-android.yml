name: Build PhoneShell Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Patch Gradle wrapper version to 8.14.0
        run: |
          sed -i 's|gradle-8.12.0-bin.zip|gradle-8.14.0-bin.zip|g' \
            phoneshell/android/gradle/wrapper/gradle-wrapper.properties
            
      - name: Flutter pub get
        working-directory: phoneshell
        run: flutter pub get

      - name: Build release APK
        working-directory: phoneshell
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv phoneshell/build/app/outputs/flutter-apk/app-release.apk \
             phoneshell/build/app/outputs/flutter-apk/phoneshell-android-${{ github.ref_name }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoneshell-android-apk
          path: phoneshell/build/app/outputs/flutter-apk/phoneshell-android-${{ github.ref_name }}.apk
          retention-days: 7

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PhoneShell Android ${{ github.ref_name }}"
          files: phoneshell/build/app/outputs/flutter-apk/phoneshell-android-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
